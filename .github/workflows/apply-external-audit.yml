name: Apply external audit patch

on:
  push:
    branches:
      - agent/multi-row-delete
    paths:
      - .audit/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/multi-row-delete
          fetch-depth: 0

      - name: Decode and validate patch
        shell: bash
        run: |
          cat .audit/part-* | base64 --decode | gzip --decompress > /tmp/public-code-change.patch
          git apply --check /tmp/public-code-change.patch

      - name: Apply audited source change
        shell: bash
        run: |
          git apply /tmp/public-code-change.patch
          rm -rf .audit
          git add --all
          git diff --cached --check

      - name: Commit audited source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: decouple row labels from native row-header glyphs"
          git push origin HEAD:agent/multi-row-delete
