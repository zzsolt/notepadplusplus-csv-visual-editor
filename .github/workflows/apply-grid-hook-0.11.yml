name: Apply grid clipboard hooks 0.11

on:
  push:
    branches:
      - agent/multi-cell-clipboard
    paths:
      - .github/workflows/apply-grid-hook-0.11.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/multi-cell-clipboard
          fetch-depth: 0

      - name: Wire form and row-selection interaction
        shell: python
        run: |
          from pathlib import Path

          form = Path('src/CsvVisualEditor/CsvGridForm.cs')
          text = form.read_text(encoding='utf-8')
          text = text.replace(
              '    private readonly System.Windows.Forms.Timer _searchTimer;\n',
              '    private readonly System.Windows.Forms.Timer _searchTimer;\n    private readonly CsvGridClipboardController _clipboardController;\n')
          text = text.replace(
              '        _grid.ClipboardCopyMode = DataGridViewClipboardCopyMode.EnableAlwaysIncludeHeaderText;\n',
              '        _grid.ClipboardCopyMode = DataGridViewClipboardCopyMode.Disable;\n')
          text = text.replace(
              '        _grid.SelectionChanged += (_, _) => UpdateControlAvailability();\n',
              '''        _grid.SelectionChanged += (_, _) => UpdateControlAvailability();
        _clipboardController = new CsvGridClipboardController(
            _grid,
            () => _editMode,
            () => _rowEditModel,
            CommitPendingEdit,
            ApplyCurrentView,
            message => _statusLabel.Text = message);
        _grid.KeyDown += _clipboardController.OnKeyDown;
''')
          text = text.replace(
              '        _grid.CancelEdit();\n        _rowEditModel.RevertAll();\n        ApplyCurrentView();\n',
              '        _grid.CancelEdit();\n        _rowEditModel.RevertAll();\n        _grid.ClearSelection();\n        ApplyCurrentView();\n')
          if '_clipboardController = new CsvGridClipboardController' not in text:
              raise SystemExit('clipboard controller hook not inserted')
          form.write_text(text, encoding='utf-8')

          behavior = Path('src/CsvVisualEditor/CsvGridRowHeaderBehavior.cs')
          text = behavior.read_text(encoding='utf-8')
          old = '''        state.Clear();
        grid.ClearSelection();
        InvalidateSelectorColumn(grid);
'''
          new = '''        var hadCompleteRowSelection = state.Capture(GetVisibleStableOrder(grid)).SelectedIds.Count > 0;
        state.Clear();
        if (hadCompleteRowSelection)
        {
            grid.ClearSelection();
        }

        InvalidateSelectorColumn(grid);
'''
          if old not in text:
              raise SystemExit('ordinary-cell selection block not found')
          text = text.replace(old, new, 1)
          behavior.write_text(text, encoding='utf-8')

          for path in ['src/CsvVisualEditor/CsvVisualEditor.csproj', 'src/CsvVisualEditor.Core/CsvVisualEditor.Core.csproj']:
              p = Path(path)
              s = p.read_text(encoding='utf-8').replace('0.10.0-alpha', '0.11.0-alpha')
              p.write_text(s, encoding='utf-8')

          doc = Path('docs/multi-cell-clipboard-0.11.md')
          s = doc.read_text(encoding='utf-8')
          marker = '## Implemented grid integration'
          if marker not in s:
              s += '''

## Implemented grid integration

- Ctrl+C copies one contiguous CSV-data rectangle as Unicode tab-separated text without headers.
- Ctrl+V is Edit-mode-only and uses the immutable matrix and stable-ID paste plan.
- A one-cell clipboard value broadcasts across a selected rectangle.
- A multi-cell matrix pasted from one current cell expands down and right only while fully in bounds.
- Exact selected rectangles require matching clipboard dimensions.
- `#` and `Select` presentation columns are excluded from copy and paste.
- Paste mutates only `CsvRowEditModel`; Apply remains the only Scintilla write boundary.
- Source and inserted rows are addressed by stable `CsvEditRowId` values.
- Starting a CSV-cell selection clears complete-row deletion context without collapsing an existing cell rectangle when no row context exists.
'''
          doc.write_text(s, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/apply-grid-hook-0.11.yml
          rm -f .github/workflows/apply-0.11-grid-integration.yml
          rm -f .github/workflows/source-snapshot-0.11.yml
          git add --all
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: wire multi-cell clipboard into the grid"
          git push origin HEAD:agent/multi-cell-clipboard
