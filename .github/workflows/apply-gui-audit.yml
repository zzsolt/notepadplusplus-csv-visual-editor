name: Apply reviewed GUI audit

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/apply-gui-audit.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'zzsolt/notepadplusplus-csv-visual-editor' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/source-navigation' && github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply checksum-verified source-only audit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/agent/source-navigation | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64, bz2, hashlib, pathlib, subprocess
          allowed = {'.github/workflows/apply-gui-audit.yml', '.gui0125audit/part-00', '.gui0125audit/part-01'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '89091267d42437c206089983e27cf4fae34aabe8', 'HEAD'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Branch changed outside transport files; refusing to overwrite.')
          encoded = ''.join(pathlib.Path(f'.gui0125audit/part-{i:02d}').read_text().strip() for i in range(2))
          patch = bz2.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '5219cfdb14e41b07223157f8cbf72811ca4fbdca60831df0994561620914cd6e':
              raise SystemExit('Patch checksum mismatch.')
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm -r .gui0125audit .github/workflows/apply-gui-audit.yml
          git diff --cached --check
          test "$(git write-tree)" = 'a7d75a515c5254352e74be0c793dde37e3360ef8'
          # The Actions token cannot change workflows. Leave this unchanged until
          # the authorized connector removes it and triggers the final candidate CI.
          git restore --source=HEAD --staged --worktree .github/workflows/apply-gui-audit.yml
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix host Apply authorization, shared About, stale loads and value readability'
          git push origin HEAD:refs/heads/agent/source-navigation
