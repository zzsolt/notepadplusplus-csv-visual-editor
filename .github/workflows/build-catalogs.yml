name: Complete interface catalogs
on:
  push:
    branches: [agent/localization]
    paths: [.github/workflows/build-catalogs.yml]
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        language: [sk, sl, sq, sr, sv, ta, te, tg, th, tr, tt, ug, uk, ur, uz, vec, vi, zh, zh_Hant, zu]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ctranslate2==4.6.0 transformers==4.49.0 sentencepiece==0.2.0 huggingface-hub==0.34.4
      - name: Generate catalog
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python .github/localization/translate.py --language '${{ matrix.language }}'
      - uses: actions/upload-artifact@v4
        with:
          name: translated-${{ matrix.language }}
          path: output/
          if-no-files-found: error
          retention-days: 2
