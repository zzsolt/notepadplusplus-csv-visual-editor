name: Apply 0.11 Excel Paste Routing Fix

on:
  push:
    branches:
      - agent/multi-cell-clipboard
    paths:
      - .apply-0.11-excel-paste-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/multi-cell-clipboard
          fetch-depth: 0

      - name: Apply routing fix and tests
        shell: python
        run: |
          from pathlib import Path

          core = Path('src/CsvVisualEditor.Core/CsvClipboardCommandRouting.cs')
          core.write_text('''namespace CsvVisualEditor.Core;

/// <summary>
/// Selects whether Ctrl+V belongs to the spreadsheet-style grid paste path or to
/// the native in-cell text editor. Multi-cell clipboard text must never be inserted
/// as one literal cell value merely because the editing control currently owns focus.
/// </summary>
public static class CsvClipboardCommandRouting
{
    public static CsvClipboardPasteRoutingTarget ResolvePasteTarget(
        bool isCellEditorActive,
        string clipboardText)
    {
        ArgumentNullException.ThrowIfNull(clipboardText);

        if (!isCellEditorActive)
        {
            return CsvClipboardPasteRoutingTarget.Grid;
        }

        return ContainsSpreadsheetSeparator(clipboardText)
            ? CsvClipboardPasteRoutingTarget.Grid
            : CsvClipboardPasteRoutingTarget.InCellEditor;
    }

    private static bool ContainsSpreadsheetSeparator(string text) =>
        text.Contains('\\t') || text.Contains('\\r') || text.Contains('\\n');
}

public enum CsvClipboardPasteRoutingTarget
{
    Grid,
    InCellEditor
}
''', encoding='utf-8')

          controller = Path('src/CsvVisualEditor/CsvGridClipboardController.cs')
          text = controller.read_text(encoding='utf-8')
          old = '''        // While a cell's text editor is active, preserve the standard text-level
        // copy/paste behavior. Rectangle commands operate when the grid owns focus.
        if (grid.IsCurrentCellInEditMode)
        {
            return false;
        }

        return key == Keys.C
'''
          new = '''        // Copy remains a text-editor command while an individual cell editor owns
        // focus. Paste is different: tabular Excel/Calc text must be promoted to the
        // grid route so it cannot be inserted as one literal cell value.
        if (key == Keys.C && grid.IsCurrentCellInEditMode)
        {
            return false;
        }

        if (key == Keys.V &&
            grid.IsCurrentCellInEditMode &&
            ShouldPreserveNativeInCellPaste())
        {
            return false;
        }

        return key == Keys.C
'''
          if old not in text:
              raise SystemExit('Clipboard focus-routing block not found')
          text = text.replace(old, new, 1)

          marker = '''    private static bool ContainsClipboardDelimiter(string value) =>
'''
          helper = '''    private static bool ShouldPreserveNativeInCellPaste()
    {
        try
        {
            if (!Clipboard.ContainsText())
            {
                return false;
            }

            var clipboardText = Clipboard.GetText(TextDataFormat.UnicodeText);
            if (clipboardText.Length == 0)
            {
                clipboardText = Clipboard.GetText(TextDataFormat.Text);
            }

            return CsvClipboardCommandRouting.ResolvePasteTarget(
                       isCellEditorActive: true,
                       clipboardText) == CsvClipboardPasteRoutingTarget.InCellEditor;
        }
        catch (ExternalException)
        {
            // Let TryPaste own the visible clipboard-unavailable diagnostic.
            return false;
        }
    }

'''
          if marker not in text:
              raise SystemExit('Clipboard helper insertion point not found')
          text = text.replace(marker, helper + marker, 1)
          controller.write_text(text, encoding='utf-8')

          tests = Path('tests/CsvVisualEditor.Core.Tests/CsvClipboardCommandRoutingTests.cs')
          tests.write_text('''namespace CsvVisualEditor.Core.Tests;

using CsvVisualEditor.Core;
using Xunit;

public sealed class CsvClipboardCommandRoutingTests
{
    [Fact]
    public void ResolvePasteTarget_GridOwnsFocus_UsesGridForSingleCellText()
    {
        Assert.Equal(
            CsvClipboardPasteRoutingTarget.Grid,
            CsvClipboardCommandRouting.ResolvePasteTarget(false, "single value"));
    }

    [Fact]
    public void ResolvePasteTarget_CellEditorOwnsFocus_PreservesSingleCellTextPaste()
    {
        Assert.Equal(
            CsvClipboardPasteRoutingTarget.InCellEditor,
            CsvClipboardCommandRouting.ResolvePasteTarget(true, "single value"));
    }

    [Fact]
    public void ResolvePasteTarget_CellEditorOwnsFocus_PreservesEmptyTextPaste()
    {
        Assert.Equal(
            CsvClipboardPasteRoutingTarget.InCellEditor,
            CsvClipboardCommandRouting.ResolvePasteTarget(true, string.Empty));
    }

    [Theory]
    [InlineData("A\\tB")]
    [InlineData("A\\r\\nB")]
    [InlineData("A\\nB")]
    public void ResolvePasteTarget_CellEditorOwnsFocus_RoutesSpreadsheetTextToGrid(
        string clipboardText)
    {
        Assert.Equal(
            CsvClipboardPasteRoutingTarget.Grid,
            CsvClipboardCommandRouting.ResolvePasteTarget(true, clipboardText));
    }
}
''', encoding='utf-8')

          smoke = Path('tests/CsvVisualEditor.NativeAot.SmokeTests/ClipboardRoutingNativeAotSmoke.cs')
          smoke.write_text('''namespace CsvVisualEditor.NativeAot.SmokeTests;

using CsvVisualEditor.Core;
using System.Runtime.CompilerServices;

internal static class ClipboardRoutingNativeAotSmoke
{
    [ModuleInitializer]
    internal static void Run()
    {
        Require(
            CsvClipboardCommandRouting.ResolvePasteTarget(true, "single") ==
                CsvClipboardPasteRoutingTarget.InCellEditor,
            "Native AOT single-cell in-editor paste routing mismatch.");
        Require(
            CsvClipboardCommandRouting.ResolvePasteTarget(true, "A\\tB\\r\\nC\\tD\\r\\n") ==
                CsvClipboardPasteRoutingTarget.Grid,
            "Native AOT spreadsheet paste was not promoted from the cell editor to the grid.");
        Require(
            CsvClipboardCommandRouting.ResolvePasteTarget(false, "single") ==
                CsvClipboardPasteRoutingTarget.Grid,
            "Native AOT grid-focus paste routing mismatch.");
    }

    private static void Require(bool condition, string message)
    {
        if (!condition)
        {
            throw new InvalidOperationException(message);
        }
    }
}
''', encoding='utf-8')

          design = Path('docs/multi-cell-clipboard-0.11.md')
          design_text = design.read_text(encoding='utf-8')
          addition = '''

## Cell-editor focus routing

Ctrl+C remains a native text-editor command while the in-cell editing control owns focus. Ctrl+V uses a content-sensitive rule:

- plain single-cell text remains a native in-cell insertion;
- text containing a tab or any line break is treated as spreadsheet data and is routed to the grid paste path even when the editing control currently owns focus;
- the current cell edit is committed before the immutable paste plan is created;
- malformed, mismatched, or overflowing tabular data is rejected atomically instead of being inserted literally into one cell.

This distinction fixes Excel-to-grid paste without breaking ordinary editing inside one cell.
'''
          if '## Cell-editor focus routing' not in design_text:
              design.write_text(design_text + addition, encoding='utf-8')

          validation = Path('docs/host-validation-0.11-clipboard.md')
          validation_text = validation.read_text(encoding='utf-8')
          discrepancy = '''

## Host discrepancy and retest — 2026-07-30

Observed in Notepad++ 8.9.7 x64: copying from the plugin to Excel worked, but a 2 × 2 Excel range pasted back only after entering an individual cell editor, where the complete tab/newline payload was inserted into that one cell.

Root cause: the application message filter unconditionally delegated Ctrl+V to the native editing control whenever `DataGridView.IsCurrentCellInEditMode` was true. Excel's tabular Unicode text therefore bypassed `CsvClipboardMatrix` and `CsvClipboardPastePlan`.

Retest the replacement package as follows:

1. Copy a simple 2 × 2 range in Excel.
2. In plugin Edit mode, single-click the intended top-left CSV data cell. It is acceptable for the cell editing control to become active.
3. Press Ctrl+V once. The four values must populate a 2 × 2 rectangle from that cell; no literal tab or line break may remain inside one cell.
4. Undo the pending change with Revert All and confirm the editor buffer was untouched.
5. Enter a cell editor, copy one ordinary word, and press Ctrl+V. That single-cell text must still insert at the caret inside the active cell editor.
6. Repeat with an exact selected 2 × 2 destination and with Windows-1250 representable content.
'''
          if '## Host discrepancy and retest — 2026-07-30' not in validation_text:
              validation.write_text(validation_text + discrepancy, encoding='utf-8')

      - name: Remove transient files
        shell: bash
        run: |
          rm -f .github/workflows/apply-0.11-excel-paste-fix.yml
          rm -f .apply-0.11-excel-paste-fix

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix: route Excel matrix paste out of cell editor"
          git push origin HEAD:agent/multi-cell-clipboard
