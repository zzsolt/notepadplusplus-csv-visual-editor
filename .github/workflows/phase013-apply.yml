name: Apply reviewed data exploration implementation
on:
  push:
    branches: [agent/data-exploration]
    paths: [.github/workflows/phase013-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact baseline and reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '64b06ff5d9ce2a68efdc955476022f71a4a61b1c'
          test "$(git ls-remote origin refs/heads/agent/data-exploration | cut -f1)" = "$(git rev-parse HEAD)"
          cat .github/transfer/phase013-{1,2,3}.b64 | base64 -d | gzip -d > /tmp/implementation.patch
          echo '426d8fce8fcf8bda56bb9c75d36acb5e770e42d94c9a17204a5ce8d446e32615  /tmp/implementation.patch' | sha256sum -c -
          git apply --check /tmp/implementation.patch
          git apply --index /tmp/implementation.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 21
          if git diff --cached --name-only | grep -Ev '^(src/|tests/|README.md$|CHANGELOG.md$)'; then exit 1; fi
          test "$(git hash-object src/CsvVisualEditor/CsvWhitespaceCellPainter.cs)" = "$(git rev-parse HEAD:src/CsvVisualEditor/CsvWhitespaceCellPainter.cs)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement bounded column filters, exact numeric multi-sort and current-view profiling with Core, Native AOT and production-host regressions'
          git push origin HEAD:refs/heads/agent/data-exploration
