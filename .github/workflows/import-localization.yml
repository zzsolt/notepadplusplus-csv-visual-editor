name: Import localization source
on:
  push:
    branches: [agent/localization]
    paths: [.github/workflows/import-localization.yml, .github/import/**]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/agent/localization | cut -f1)" = "$(git rev-parse HEAD)"
          python .github/import/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add centrally keyed UI localization and concise product documentation'
          git push origin HEAD:refs/heads/agent/localization
