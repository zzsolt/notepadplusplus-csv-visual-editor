name: Review current GUI source
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/review-0126.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only tracked files
        run: |
          mkdir -p /tmp/review
          git rev-parse HEAD > /tmp/review/commit.txt
          git ls-tree -r HEAD > /tmp/review/tree.txt
          git archive --format=tar.gz --output=/tmp/review/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-review-0126
          path: /tmp/review/
          retention-days: 3
          if-no-files-found: error
