name: Apply 0.11 grid integration

on:
  push:
    branches:
      - agent/multi-cell-clipboard
    paths:
      - .github/workflows/apply-0.11-grid-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/multi-cell-clipboard
          fetch-depth: 0

      - name: Apply implementation
        shell: python
        run: |
          from pathlib import Path

          Path('src/CsvVisualEditor.Core/CsvClipboardPastePlan.cs').write_text(r'''namespace CsvVisualEditor.Core;

using System.Collections.ObjectModel;

/// <summary>
/// Stable address of one editable CSV cell. Row identity is a CsvEditRowId and column
/// identity is the physical CSV column index. Presentation objects and display indexes
/// are deliberately excluded.
/// </summary>
public readonly record struct CsvCellAddress(CsvEditRowId RowId, int ColumnIndex);

public enum CsvClipboardPasteStatus
{
    Ready,
    EmptyTarget,
    ShapeMismatch,
    TargetOutsideSession
}

public sealed record CsvClipboardCellEdit(CsvCellAddress Address, string Value);

/// <summary>
/// Fully prevalidated immutable paste operation. The plan targets stable row IDs and
/// physical CSV columns and can therefore survive presentation-only column ordering.
/// </summary>
public sealed class CsvClipboardPastePlan
{
    private CsvClipboardPastePlan(
        CsvClipboardPasteStatus status,
        IReadOnlyList<CsvClipboardCellEdit> edits)
    {
        Status = status;
        Edits = new ReadOnlyCollection<CsvClipboardCellEdit>(edits.ToArray());
    }

    public CsvClipboardPasteStatus Status { get; }

    public bool IsReady => Status == CsvClipboardPasteStatus.Ready;

    public ReadOnlyCollection<CsvClipboardCellEdit> Edits { get; }

    public static CsvClipboardPastePlan Create(
        CsvRowEditModel model,
        IReadOnlyList<CsvEditRowId> orderedRowIds,
        int startRowOffset,
        int startColumnIndex,
        int targetRowCount,
        int targetColumnCount,
        CsvClipboardMatrix matrix)
    {
        ArgumentNullException.ThrowIfNull(model);
        ArgumentNullException.ThrowIfNull(orderedRowIds);
        ArgumentNullException.ThrowIfNull(matrix);

        if (targetRowCount <= 0 || targetColumnCount <= 0)
        {
            return new CsvClipboardPastePlan(CsvClipboardPasteStatus.EmptyTarget, []);
        }

        var broadcast = matrix.IsSingleCell;
        if (!broadcast &&
            (matrix.RowCount != targetRowCount || matrix.ColumnCount != targetColumnCount))
        {
            return new CsvClipboardPastePlan(CsvClipboardPasteStatus.ShapeMismatch, []);
        }

        if (startRowOffset < 0 ||
            startColumnIndex < 0 ||
            startRowOffset + targetRowCount > orderedRowIds.Count ||
            startColumnIndex + targetColumnCount > model.ColumnCount)
        {
            return new CsvClipboardPastePlan(CsvClipboardPasteStatus.TargetOutsideSession, []);
        }

        var edits = new List<CsvClipboardCellEdit>(targetRowCount * targetColumnCount);
        try
        {
            for (var rowOffset = 0; rowOffset < targetRowCount; rowOffset++)
            {
                var rowId = orderedRowIds[startRowOffset + rowOffset];
                var row = model.GetRow(rowId);
                if (row.IsDeleted)
                {
                    return new CsvClipboardPastePlan(CsvClipboardPasteStatus.TargetOutsideSession, []);
                }

                for (var columnOffset = 0; columnOffset < targetColumnCount; columnOffset++)
                {
                    var columnIndex = startColumnIndex + columnOffset;
                    _ = row.Values[columnIndex];
                    edits.Add(new CsvClipboardCellEdit(
                        new CsvCellAddress(rowId, columnIndex),
                        broadcast ? matrix[0, 0] : matrix[rowOffset, columnOffset]));
                }
            }
        }
        catch (ArgumentOutOfRangeException)
        {
            return new CsvClipboardPastePlan(CsvClipboardPasteStatus.TargetOutsideSession, []);
        }

        return new CsvClipboardPastePlan(CsvClipboardPasteStatus.Ready, edits);
    }

    /// <summary>
    /// Applies the plan atomically to the pending row-edit model. If an unexpected model
    /// error occurs, already changed cells are restored before the exception is rethrown.
    /// No Scintilla or disk operation occurs here.
    /// </summary>
    public int Apply(CsvRowEditModel model)
    {
        ArgumentNullException.ThrowIfNull(model);
        if (!IsReady)
        {
            throw new InvalidOperationException("Only a ready clipboard paste plan can be applied.");
        }

        var originals = new string[Edits.Count];
        for (var index = 0; index < Edits.Count; index++)
        {
            var edit = Edits[index];
            var row = model.GetRow(edit.Address.RowId);
            if (row.IsDeleted)
            {
                throw new InvalidOperationException("A clipboard target row is no longer editable.");
            }

            originals[index] = row.Values[edit.Address.ColumnIndex];
        }

        var changed = 0;
        var appliedCount = 0;
        try
        {
            for (; appliedCount < Edits.Count; appliedCount++)
            {
                var edit = Edits[appliedCount];
                if (model.SetCellValue(edit.Address.RowId, edit.Address.ColumnIndex, edit.Value))
                {
                    changed++;
                }
            }
        }
        catch
        {
            for (var index = appliedCount - 1; index >= 0; index--)
            {
                var edit = Edits[index];
                model.SetCellValue(edit.Address.RowId, edit.Address.ColumnIndex, originals[index]);
            }

            throw;
        }

        return changed;
    }
}
''', encoding='utf-8')

          Path('src/CsvVisualEditor/CsvGridClipboardController.cs').write_text(r'''namespace CsvVisualEditor;

using CsvVisualEditor.Core;
using System.Globalization;
using System.Runtime.InteropServices;
using System.Text;

/// <summary>
/// Translates ephemeral DataGridView cell selection into stable row-ID/physical-column
/// clipboard operations. The controller never writes to Scintilla or disk.
/// </summary>
internal sealed class CsvGridClipboardController
{
    private readonly DataGridView _grid;
    private readonly Func<bool> _isEditMode;
    private readonly Func<CsvRowEditModel?> _getModel;
    private readonly Func<bool> _commitPendingEdit;
    private readonly Action _refreshView;
    private readonly Action<string> _showStatus;

    public CsvGridClipboardController(
        DataGridView grid,
        Func<bool> isEditMode,
        Func<CsvRowEditModel?> getModel,
        Func<bool> commitPendingEdit,
        Action refreshView,
        Action<string> showStatus)
    {
        _grid = grid ?? throw new ArgumentNullException(nameof(grid));
        _isEditMode = isEditMode ?? throw new ArgumentNullException(nameof(isEditMode));
        _getModel = getModel ?? throw new ArgumentNullException(nameof(getModel));
        _commitPendingEdit = commitPendingEdit ?? throw new ArgumentNullException(nameof(commitPendingEdit));
        _refreshView = refreshView ?? throw new ArgumentNullException(nameof(refreshView));
        _showStatus = showStatus ?? throw new ArgumentNullException(nameof(showStatus));
    }

    public void OnKeyDown(object? sender, KeyEventArgs e)
    {
        if (!e.Control || e.Alt)
        {
            return;
        }

        if (e.KeyCode == Keys.C)
        {
            if (TryCopy())
            {
                e.Handled = true;
                e.SuppressKeyPress = true;
            }
        }
        else if (e.KeyCode == Keys.V)
        {
            if (TryPaste())
            {
                e.Handled = true;
                e.SuppressKeyPress = true;
            }
        }
    }

    public bool TryCopy()
    {
        if (_grid.Rows.Count == 0 || _grid.Columns.Count == 0)
        {
            return false;
        }

        var rectangle = CaptureRectangle(useCurrentCellWhenEmpty: true);
        if (rectangle is null)
        {
            _showStatus("Copy requires one contiguous rectangular selection of CSV data cells.");
            return true;
        }

        var builder = new StringBuilder();
        for (var rowOffset = 0; rowOffset < rectangle.Value.RowCount; rowOffset++)
        {
            if (rowOffset > 0)
            {
                builder.Append("\r\n");
            }

            for (var columnOffset = 0; columnOffset < rectangle.Value.ColumnCount; columnOffset++)
            {
                if (columnOffset > 0)
                {
                    builder.Append('\t');
                }

                var value = _grid.Rows[rectangle.Value.StartRow + rowOffset]
                    .Cells[rectangle.Value.StartColumn + columnOffset].Value;
                builder.Append(Convert.ToString(value, CultureInfo.InvariantCulture) ?? string.Empty);
            }
        }

        try
        {
            Clipboard.SetText(builder.ToString(), TextDataFormat.UnicodeText);
            _showStatus(
                $"Copied {rectangle.Value.RowCount.ToString(CultureInfo.CurrentCulture)} × " +
                $"{rectangle.Value.ColumnCount.ToString(CultureInfo.CurrentCulture)} CSV cells.");
        }
        catch (ExternalException)
        {
            _showStatus("The Windows clipboard is temporarily unavailable. No data was changed.");
        }
        catch (ThreadStateException)
        {
            _showStatus("Clipboard access requires the Notepad++ UI thread. No data was changed.");
        }

        return true;
    }

    public bool TryPaste()
    {
        if (!_isEditMode())
        {
            _showStatus("Paste is available only in Edit mode.");
            return true;
        }

        var model = _getModel();
        if (model is null)
        {
            _showStatus("Paste is unavailable for the current table.");
            return true;
        }

        if (!_commitPendingEdit())
        {
            _showStatus("The active cell edit could not be committed. Correct the value before pasting.");
            return true;
        }

        string clipboardText;
        try
        {
            if (!Clipboard.ContainsText(TextDataFormat.UnicodeText) &&
                !Clipboard.ContainsText(TextDataFormat.Text))
            {
                _showStatus("The clipboard does not contain plain text cells.");
                return true;
            }

            clipboardText = Clipboard.GetText(TextDataFormat.UnicodeText);
            if (clipboardText.Length == 0)
            {
                clipboardText = Clipboard.GetText(TextDataFormat.Text);
            }
        }
        catch (ExternalException)
        {
            _showStatus("The Windows clipboard is temporarily unavailable. No data was changed.");
            return true;
        }

        var matrix = CsvClipboardMatrix.Parse(clipboardText);
        var selectedRectangle = CaptureRectangle(useCurrentCellWhenEmpty: true);
        if (selectedRectangle is null)
        {
            _showStatus("Paste requires one contiguous rectangular selection of CSV data cells.");
            return true;
        }

        var target = selectedRectangle.Value;
        if (target.CellCount == 1 && !matrix.IsSingleCell)
        {
            target = new GridRectangle(
                target.StartRow,
                target.StartColumn,
                matrix.RowCount,
                matrix.ColumnCount);
        }

        var orderedRowIds = _grid.Rows
            .Cast<DataGridViewRow>()
            .Select(static row => row.Tag)
            .OfType<CsvEditRowId>()
            .ToArray();
        if (orderedRowIds.Length != _grid.Rows.Count)
        {
            _showStatus("Paste targets are not available outside the stable Edit-mode row model.");
            return true;
        }

        var plan = CsvClipboardPastePlan.Create(
            model,
            orderedRowIds,
            target.StartRow,
            target.StartColumn,
            target.RowCount,
            target.ColumnCount,
            matrix);
        if (!plan.IsReady)
        {
            _showStatus(plan.Status switch
            {
                CsvClipboardPasteStatus.ShapeMismatch =>
                    "Paste blocked: the clipboard rectangle must match the selected rectangle, unless one clipboard cell is being broadcast.",
                CsvClipboardPasteStatus.TargetOutsideSession =>
                    "Paste blocked: the target rectangle extends beyond the current CSV table.",
                _ => "Paste blocked: there is no editable target rectangle."
            });
            return true;
        }

        var changed = plan.Apply(model);
        var addresses = plan.Edits.Select(static edit => edit.Address).ToArray();
        _refreshView();
        RestoreSelection(addresses);
        _showStatus(
            changed == 0
                ? "Paste completed; all target values were already identical."
                : $"Pasted {changed.ToString(CultureInfo.CurrentCulture)} changed cells into the pending edit session. Apply writes them to Notepad++."
        );
        return true;
    }

    private GridRectangle? CaptureRectangle(bool useCurrentCellWhenEmpty)
    {
        var selected = _grid.SelectedCells
            .Cast<DataGridViewCell>()
            .Where(IsCsvDataCell)
            .ToArray();
        if (selected.Length == 0 && useCurrentCellWhenEmpty &&
            _grid.CurrentCell is DataGridViewCell current && IsCsvDataCell(current))
        {
            selected = [current];
        }

        if (selected.Length == 0)
        {
            return null;
        }

        var firstRow = selected.Min(static cell => cell.RowIndex);
        var lastRow = selected.Max(static cell => cell.RowIndex);
        var firstColumn = selected.Min(static cell => cell.ColumnIndex);
        var lastColumn = selected.Max(static cell => cell.ColumnIndex);
        var rectangle = new GridRectangle(
            firstRow,
            firstColumn,
            lastRow - firstRow + 1,
            lastColumn - firstColumn + 1);
        if (selected.Length != rectangle.CellCount)
        {
            return null;
        }

        for (var rowIndex = firstRow; rowIndex <= lastRow; rowIndex++)
        {
            for (var columnIndex = firstColumn; columnIndex <= lastColumn; columnIndex++)
            {
                var cell = _grid.Rows[rowIndex].Cells[columnIndex];
                if (!IsCsvDataCell(cell) || !cell.Selected)
                {
                    return null;
                }
            }
        }

        return rectangle;
    }

    private bool IsCsvDataCell(DataGridViewCell cell) =>
        cell.RowIndex >= 0 &&
        cell.ColumnIndex >= 0 &&
        cell.RowIndex < _grid.Rows.Count &&
        cell.ColumnIndex < _grid.Columns.Count &&
        !CsvGridRowHeaderBehavior.IsPresentationColumn(_grid.Columns[cell.ColumnIndex]);

    private void RestoreSelection(IReadOnlyList<CsvCellAddress> addresses)
    {
        _grid.ClearSelection();
        DataGridViewCell? first = null;
        foreach (var address in addresses)
        {
            foreach (DataGridViewRow row in _grid.Rows)
            {
                if (row.Tag is CsvEditRowId rowId && rowId == address.RowId &&
                    address.ColumnIndex >= 0 && address.ColumnIndex < _grid.Columns.Count)
                {
                    var cell = row.Cells[address.ColumnIndex];
                    cell.Selected = true;
                    first ??= cell;
                    break;
                }
            }
        }

        if (first is not null)
        {
            _grid.CurrentCell = first;
        }
    }

    private readonly record struct GridRectangle(
        int StartRow,
        int StartColumn,
        int RowCount,
        int ColumnCount)
    {
        public int CellCount => checked(RowCount * ColumnCount);
    }
}
