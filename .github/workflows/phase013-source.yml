name: Phase 013 source snapshot
on:
  push:
    branches: [agent/data-exploration]
    paths: [.github/workflows/phase013-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/source
          git rev-parse HEAD > /tmp/source/commit.txt
          git ls-tree -r HEAD > /tmp/source/tree.txt
          git archive --format=tar.gz HEAD > /tmp/source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: phase013-source
          path: /tmp/source/
          retention-days: 3
          if-no-files-found: error
