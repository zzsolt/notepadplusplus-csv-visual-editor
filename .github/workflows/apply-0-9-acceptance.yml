name: Apply 0.9 owner acceptance

on:
  push:
    branches:
      - agent/multi-row-delete
    paths:
      - .acceptance/0.9-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout milestone branch
        uses: actions/checkout@v4
        with:
          ref: agent/multi-row-delete
          fetch-depth: 0

      - name: Record owner acceptance
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '> Development status: **0.9 multi-row deletion alpha under Notepad++ host validation**.',
              '> Development status: **0.9 multi-row deletion alpha accepted in Notepad++ 8.9.7 x64**.'
          )
          text = text.replace(
              '> The native-glyph/row-number separation is covered by automated checks but remains pending owner visual acceptance in Notepad++ 8.9.7 x64.',
              '> The owner accepted the final native-glyph/row-number separation package on 2026-07-29 and authorized milestone closure.'
          )
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          text = text.replace(
              '## [Unreleased]\n\n### Fixed',
              '## [Unreleased]\n\n## [0.9.0-alpha] — 2026-07-29\n\n### Fixed',
              1
          )
          text = text.replace('\n## [0.9.0-alpha] — 2026-07-23\n', '\n', 1)
          text = text.replace(
              '- Final visual acceptance remains pending in the owner\'s real Notepad++ 8.9.7 x64 host; this changelog does not claim the host defect is closed.',
              '- The owner accepted the final package in Notepad++ 8.9.7 x64 on 2026-07-29 and explicitly authorized closing milestone 0.9.'
          )
          text = text.replace(
              '- Full win-x64 Native AOT plugin publish and `0.9.0-alpha` package creation passed in CI `30267490767` on public head `cdd9c8f4a2b87caa21c489e04f44fa86fb25040f`.',
              '- Full win-x64 Native AOT plugin publish and `0.9.0-alpha` package creation passed in final CI `30387337728` on public head `ee686b75e65800dd1e6e959e477d60fd1d2234d1`.'
          )
          text = text.replace(
              '- The owner confirmed the checkbox-only selector deletion path works in Notepad++ 8.9.7 x64; synchronized row-header acceptance is pending.',
              '- The owner accepted synchronized checkbox/native-header/`#` selection, batch deletion, Revert, and the final row-presentation package in Notepad++ 8.9.7 x64.'
          )
          changelog.write_text(text, encoding='utf-8')

          validation = Path('docs/host-validation-0.9.md')
          text = validation.read_text(encoding='utf-8')
          acceptance = '''\n\n## Owner acceptance — 2026-07-29\n\nThe owner reported that the final package was “tökéletes lett” in the target Notepad++ 8.9.7 x64 environment and explicitly authorized closing milestone 0.9 and starting milestone 0.10. This closes the previously pending native-glyph/row-label visual gate and confirms that the accepted checkbox, complete-row, Ctrl, Shift, Delete, batch deletion, and Revert behavior did not regress in the accepted package.\n\nThe final automated evidence remains CI run `30387337728`, job `90369811550`, with 168/168 xUnit tests, Native AOT runtime smoke, win-x64 publish, and packaging passing. The owner did not provide a separate item-by-item A–N transcript; the milestone closure records the owner-level final-package acceptance and explicit merge authorization rather than inventing individual test observations.\n'''
          if '## Owner acceptance — 2026-07-29' not in text:
              text += acceptance
          validation.write_text(text, encoding='utf-8')

          Path('docs/host-acceptance-0.9.md').write_text('''# Milestone 0.9 owner acceptance\n\n## Decision\n\nMilestone 0.9 is accepted for merge. On 2026-07-29 the owner reported that the final package was “tökéletes lett” in Notepad++ 8.9.7 x64 and explicitly instructed the project to close 0.9 and begin 0.10.\n\n## Accepted implementation\n\n- stable-ID synchronized checkbox, native-row-header, and `#`-column complete-row selection;\n- plain, Ctrl, Shift, and Ctrl+Shift row gestures;\n- ordinary-cell clearing and no current-cell deletion fallback;\n- atomic multi-row deletion and exact Revert All;\n- glyph-only native row header plus aligned, content-sized `#` indicator column;\n- unchanged conflict blocking, one-undo Apply, UTF-8 gate, and Notepad++ Save ownership.\n\n## Automated evidence\n\n```text\nPublic implementation head: ee686b75e65800dd1e6e959e477d60fd1d2234d1\nCI run: 30387337728 — PASS\nCI job: 90369811550 — PASS\nCore xUnit: 168/168 PASS\nNative AOT runtime smoke: PASS\nwin-x64 Native AOT publish/package: PASS\nArtifact ID: 8699579177\nInner ZIP SHA-256: d79e0d28a3d41b18476418600a2ee59e1979eecae404db71fe0218459733141f\nDLL SHA-256: b32aae7a57affbe2bb1a38d9321539919df6de9b1d056c2b640c8913131dec28\n```\n\n## Evidence boundary\n\nNo separate line-by-line A–N result transcript was supplied. This record therefore represents the owner’s final-package acceptance and explicit authorization to close the milestone; it does not fabricate unreported observations.\n\n## Merge order\n\nMerge public PR #9 first. Record its actual merge SHA in the internal repository, synchronize the internal acceptance state, and merge internal PR #9 second.\n''', encoding='utf-8')

      - name: Commit acceptance record
        shell: bash
        run: |
          rm -rf .acceptance
          rm -f .github/workflows/apply-0-9-acceptance.yml
          git add --all
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record 0.9 owner acceptance"
          git push origin HEAD:agent/multi-row-delete
