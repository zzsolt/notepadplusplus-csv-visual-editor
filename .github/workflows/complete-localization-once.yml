name: Complete localization once

on:
  push:
    branches: [agent/localization]
    paths: [.github/workflows/complete-localization-once.yml]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.languages.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: languages
        shell: python
        run: |
          import json, os, subprocess
          languages = json.loads(subprocess.check_output([
              'python', '.github/localization/translate.py', '--list'
          ]))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('value=' + json.dumps(languages, separators=(',', ':')) + '\n')
          print('Provider catalogs:', len(languages))

  translate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ctranslate2==4.6.0 transformers==4.49.0 sentencepiece==0.2.0 huggingface-hub==0.34.4
      - name: Generate provider catalog
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python .github/localization/translate.py --language '${{ matrix.language }}'
      - uses: actions/upload-artifact@v4
        with:
          name: provider-${{ matrix.language }}
          path: output/
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [plan, translate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localization
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: provider-*
          path: model-input
          merge-multiple: true
      - name: Build explicit variants and apply curated terminology
        run: |
          python .github/localization/complete_catalogs.py \
            --model-dir model-input \
            --resource src/CsvVisualEditor.Localization \
            --glossary .github/localization/curated/common-europe.tsv \
            --glossary .github/localization/curated/common-world.tsv
      - name: Validate and promote the complete catalog set
        shell: bash
        run: |
          set -euo pipefail
          fingerprint=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/localization')
          import import_catalogs as importer
          source = importer.read(Path('src/CsvVisualEditor.Localization/Catalogs/en.json'))['messages']
          print(importer.fingerprint(source))
          PY
          )
          python tools/localization/import_catalogs.py \
            --input model-input \
            --curated .github/localization/curated \
            --legacy-source-fingerprint "$fingerprint" \
            --overrides .github/localization/curated/corrections.json \
            --output reviewed-catalogs \
            --report catalog-coverage.json
          rm -rf src/CsvVisualEditor.Localization/Catalogs
          mv reviewed-catalogs src/CsvVisualEditor.Localization/Catalogs
          python -m unittest discover -s tests/localization -p 'test_*.py'
          python tools/localization/generate.py --check
          python tools/localization/verify.py --check-upstream
          git diff --check
          test "$(git hash-object src/CsvVisualEditor/CsvWhitespaceCellPainter.cs)" = 39ab5cc25f9b88e946e5feabdf77e439019d0229
      - name: Remove obsolete transfer workflows
        shell: bash
        run: |
          git rm -rf --ignore-unmatch .github/import
          git rm --ignore-unmatch \
            .github/workflows/build-catalogs.yml \
            .github/workflows/refine-catalogs.yml \
            .github/workflows/export-curated.yml \
            .github/workflows/import-localization.yml \
            .github/workflows/localization-validation.yml \
            .github/workflows/complete-localization-once.yml
      - name: Commit completed catalogs
        shell: bash
        run: |
          set -euo pipefail
          git add src/CsvVisualEditor.Localization/Catalogs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete interface localization [test-package]'
          git push origin HEAD:refs/heads/agent/localization
