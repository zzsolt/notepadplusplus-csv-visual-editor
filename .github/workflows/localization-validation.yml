name: Update localization validation
on:
  push:
    branches: [agent/localization]
    paths: [.github/workflows/localization-validation.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply validated source update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = bcdb57d7d102c5e72edc6746930cbe2253a11591
          test "$(git ls-remote origin refs/heads/agent/localization | cut -f1)" = "$(git rev-parse HEAD)"
          cat .github/import/l10n-{a,b}.b64 | base64 -d > /tmp/source-update.gz
          echo '7519dcc66382935e250ba06377bc0656c48e9042a428b228b3c3a7e9b585c319  /tmp/source-update.gz' | sha256sum -c -
          gzip -dc /tmp/source-update.gz > /tmp/source-update.patch
          git apply --check /tmp/source-update.patch
          git apply --index /tmp/source-update.patch
          python -m unittest discover -s tests/localization -p 'test_*.py'
          git diff --cached --check
          test "$(git hash-object src/CsvVisualEditor/CsvWhitespaceCellPainter.cs)" = 39ab5cc25f9b88e946e5feabdf77e439019d0229
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate complete catalogs and localized runtime behavior'
          git push origin HEAD:refs/heads/agent/localization
