name: Source review snapshot

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/source-review.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/source-review
          git rev-parse HEAD > /tmp/source-review/commit.txt
          git ls-tree -r HEAD > /tmp/source-review/tree.txt
          git archive --format=tar.gz --output=/tmp/source-review/source.tar.gz HEAD
          cd /tmp/source-review
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tracked-source-review
          path: /tmp/source-review/
          if-no-files-found: error
          retention-days: 3
