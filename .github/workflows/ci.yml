name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/CsvVisualEditor.Core/CsvVisualEditor.Core.csproj
          dotnet restore tests/CsvVisualEditor.Core.SmokeTests/CsvVisualEditor.Core.SmokeTests.csproj
          dotnet restore tests/CsvVisualEditor.Core.Tests/CsvVisualEditor.Core.Tests.csproj
          dotnet restore src/CsvVisualEditor/CsvVisualEditor.csproj -r win-x64

      - name: Build core library
        shell: pwsh
        run: dotnet build src/CsvVisualEditor.Core/CsvVisualEditor.Core.csproj -c Release --no-restore

      - name: Run bootstrap smoke tests
        shell: pwsh
        run: dotnet run --project tests/CsvVisualEditor.Core.SmokeTests/CsvVisualEditor.Core.SmokeTests.csproj -c Release --no-restore

      - name: Run xUnit parser tests
        shell: pwsh
        run: dotnet run --project tests/CsvVisualEditor.Core.Tests/CsvVisualEditor.Core.Tests.csproj -c Release --no-restore

      - name: Publish x64 Native AOT plugin
        id: publish
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet publish src/CsvVisualEditor/CsvVisualEditor.csproj `
            -c Release `
            -f net10.0-windows `
            -r win-x64 `
            -o artifacts/publish *>&1 |
              Tee-Object -FilePath artifacts/publish.log
          exit $LASTEXITCODE

      - name: Create installable test ZIP
        if: steps.publish.outcome == 'success'
        shell: pwsh
        run: |
          $pluginDirectory = 'artifacts/package/CsvVisualEditor'
          New-Item -ItemType Directory -Path $pluginDirectory -Force | Out-Null
          Copy-Item 'artifacts/publish/CsvVisualEditor.dll' $pluginDirectory
          Compress-Archive `
            -Path $pluginDirectory `
            -DestinationPath 'artifacts/CsvVisualEditor-0.3.0-alpha-win-x64.zip' `
            -CompressionLevel Optimal `
            -Force

      - name: Upload installable test package
        if: steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-0.3.0-alpha-win-x64
          path: artifacts/CsvVisualEditor-0.3.0-alpha-win-x64.zip
          if-no-files-found: error

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-publish-diagnostics
          path: artifacts/publish.log
          if-no-files-found: error

      - name: Fail workflow when publish failed
        if: steps.publish.outcome != 'success'
        shell: pwsh
        run: throw 'Native AOT publish failed. Inspect publish.log in the workflow artifact.'
