name: CI
on:
  workflow_dispatch:
    inputs:
      publish_test_package:
        description: Upload the installable test package artifact
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', '.github/**', 'Directory.Build.*', 'global.json', '**/NuGet.config', '**/nuget.config', '*.sln', '*.slnx', '**/packages.lock.json']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', '.github/**', 'Directory.Build.*', 'global.json', '**/NuGet.config', '**/nuget.config', '*.sln', '*.slnx', '**/packages.lock.json']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      validate: ${{ steps.plan.outputs.validate }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 tools/ci/plan.py
  validate:
    needs: plan
    if: needs.plan.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate CI policy and localization
        run: |
          python -m unittest discover -s tests/ci -p 'test_*.py'
          python -m unittest discover -s tests/localization -p 'test_*.py'
          python tools/localization/verify.py --check-upstream
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test host-independent code
        run: |
          dotnet build src/CsvVisualEditor.Core/CsvVisualEditor.Core.csproj -c Release
          dotnet run --project tests/CsvVisualEditor.Core.SmokeTests -c Release
          dotnet run --project tests/CsvVisualEditor.Core.Tests -c Release
  build-test-publish:
    needs: [plan, validate]
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: 0.15.0-alpha.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Determine package upload policy
        id: package_candidate
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUBLISH_TEST_PACKAGE: ${{ inputs.publish_test_package }}
        run: |
          $publish = & .github/scripts/Get-TestPackagePolicy.ps1 -EventName $env:GITHUB_EVENT_NAME -PullRequestHeadSha $env:PR_HEAD_SHA -PublishTestPackage $env:PUBLISH_TEST_PACKAGE
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Run the complete local candidate gate
        id: candidate
        shell: pwsh
        run: pwsh -NoProfile -File tools/build-local.ps1 -PackageVersion $env:PACKAGE_VERSION
      - name: Upload candidate diagnostics
        if: always() && steps.candidate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-candidate-diagnostics
          path: |
            artifacts/local/${{ env.PACKAGE_VERSION }}/*.log
            artifacts/local/${{ env.PACKAGE_VERSION }}/SHA256.txt
            artifacts/local/${{ env.PACKAGE_VERSION }}/artifacts/ui-review/
            artifacts/local/${{ env.PACKAGE_VERSION }}/host-review/
            artifacts/local/${{ env.PACKAGE_VERSION }}/keyboard-input-review/
            artifacts/local/${{ env.PACKAGE_VERSION }}/localized-host-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload installable test package
        if: success() && steps.candidate.outcome == 'success' && steps.package_candidate.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-${{ env.PACKAGE_VERSION }}-win-x64
          path: artifacts/local/${{ env.PACKAGE_VERSION }}/CsvVisualEditor-${{ env.PACKAGE_VERSION }}-win-x64.zip
          if-no-files-found: error
          retention-days: 7
