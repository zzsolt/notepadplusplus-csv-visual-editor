name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Restore
        id: restore
        continue-on-error: true
        shell: pwsh
        run: |
          $logPath = 'artifacts/restore.log'
          $restoreCommands = @(
            @('src/CsvVisualEditor.Core/CsvVisualEditor.Core.csproj'),
            @('tests/CsvVisualEditor.Core.SmokeTests/CsvVisualEditor.Core.SmokeTests.csproj'),
            @('tests/CsvVisualEditor.Core.Tests/CsvVisualEditor.Core.Tests.csproj'),
            @('tests/CsvVisualEditor.NativeAot.SmokeTests/CsvVisualEditor.NativeAot.SmokeTests.csproj', '-r', 'win-x64'),
            @('src/CsvVisualEditor/CsvVisualEditor.csproj', '-r', 'win-x64')
          )
          foreach ($arguments in $restoreCommands) {
            dotnet restore @arguments *>&1 |
              Tee-Object -FilePath $logPath -Append
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-restore-diagnostics
          path: artifacts/restore.log
          if-no-files-found: error

      - name: Build core library
        if: steps.restore.outcome == 'success'
        id: core_build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build src/CsvVisualEditor.Core/CsvVisualEditor.Core.csproj `
            -c Release `
            --no-restore *>&1 |
              Tee-Object -FilePath artifacts/core-build.log
          exit $LASTEXITCODE

      - name: Upload core build diagnostics
        if: always() && steps.core_build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-core-build-diagnostics
          path: artifacts/core-build.log
          if-no-files-found: error

      - name: Run bootstrap smoke tests
        if: steps.core_build.outcome == 'success'
        id: smoke_tests
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet run `
            --project tests/CsvVisualEditor.Core.SmokeTests/CsvVisualEditor.Core.SmokeTests.csproj `
            -c Release `
            --no-restore *>&1 |
              Tee-Object -FilePath artifacts/smoke-tests.log
          exit $LASTEXITCODE

      - name: Upload smoke test diagnostics
        if: always() && steps.smoke_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-smoke-test-diagnostics
          path: artifacts/smoke-tests.log
          if-no-files-found: error

      - name: Run xUnit parser and table tests
        if: steps.core_build.outcome == 'success' && steps.smoke_tests.outcome == 'success'
        id: core_tests
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet run `
            --project tests/CsvVisualEditor.Core.Tests/CsvVisualEditor.Core.Tests.csproj `
            -c Release `
            --no-restore *>&1 |
              Tee-Object -FilePath artifacts/core-tests.log
          exit $LASTEXITCODE

      - name: Upload core test diagnostics
        if: always() && steps.core_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-core-test-diagnostics
          path: artifacts/core-tests.log
          if-no-files-found: error

      - name: Publish and run Native AOT table runtime smoke test
        if: >-
          steps.core_build.outcome == 'success' &&
          steps.smoke_tests.outcome == 'success' &&
          steps.core_tests.outcome == 'success'
        id: native_aot_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $logPath = 'artifacts/native-aot-runtime-smoke.log'
          dotnet publish tests/CsvVisualEditor.NativeAot.SmokeTests/CsvVisualEditor.NativeAot.SmokeTests.csproj `
            -c Release `
            -f net10.0-windows `
            -r win-x64 `
            --no-restore `
            -o artifacts/native-aot-smoke *>&1 |
              Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          try {
            & tests/CsvVisualEditor.NativeAot.SmokeTests/Invoke-Smoke.ps1 `
              -LibraryPath artifacts/native-aot-smoke/CsvVisualEditor.NativeAot.SmokeTests.dll `
              -LogPath artifacts/native-aot-runtime-smoke-execution.log *>&1 |
                Tee-Object -FilePath $logPath -Append
          }
          catch {
            $_ | Out-String | Tee-Object -FilePath $logPath -Append
            exit 1
          }

      - name: Upload Native AOT runtime smoke diagnostics
        if: always() && steps.native_aot_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-native-aot-runtime-smoke-diagnostics
          path: |
            artifacts/native-aot-runtime-smoke.log
            artifacts/native-aot-runtime-smoke-execution.log
          if-no-files-found: error

      - name: Publish x64 Native AOT plugin
        if: >-
          steps.core_build.outcome == 'success' &&
          steps.smoke_tests.outcome == 'success' &&
          steps.core_tests.outcome == 'success' &&
          steps.native_aot_smoke.outcome == 'success'
        id: publish
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet publish src/CsvVisualEditor/CsvVisualEditor.csproj `
            -c Release `
            -f net10.0-windows `
            -r win-x64 `
            -o artifacts/publish *>&1 |
              Tee-Object -FilePath artifacts/publish.log
          exit $LASTEXITCODE

      - name: Create installable test ZIP
        if: steps.publish.outcome == 'success'
        shell: pwsh
        run: |
          $pluginDirectory = 'artifacts/package/CsvVisualEditor'
          New-Item -ItemType Directory -Path $pluginDirectory -Force | Out-Null
          Copy-Item 'artifacts/publish/CsvVisualEditor.dll' $pluginDirectory
          Compress-Archive `
            -Path $pluginDirectory `
            -DestinationPath 'artifacts/CsvVisualEditor-0.11.0-alpha-win-x64.zip' `
            -CompressionLevel Optimal `
            -Force

      - name: Upload installable test package
        if: steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-0.11.0-alpha-win-x64
          path: artifacts/CsvVisualEditor-0.11.0-alpha-win-x64.zip
          if-no-files-found: error

      - name: Upload publish diagnostics
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: CsvVisualEditor-publish-diagnostics
          path: artifacts/publish.log
          if-no-files-found: error

      - name: Fail workflow when restore failed
        if: steps.restore.outcome != 'success'
        shell: pwsh
        run: throw 'Restore failed. Inspect restore.log in the workflow artifact.'

      - name: Fail workflow when core build failed
        if: steps.restore.outcome == 'success' && steps.core_build.outcome != 'success'
        shell: pwsh
        run: throw 'Core build failed. Inspect core-build.log in the workflow artifact.'

      - name: Fail workflow when smoke tests failed
        if: steps.core_build.outcome == 'success' && steps.smoke_tests.outcome != 'success'
        shell: pwsh
        run: throw 'Bootstrap smoke tests failed. Inspect smoke-tests.log in the workflow artifact.'

      - name: Fail workflow when core tests failed
        if: >-
          steps.core_build.outcome == 'success' &&
          steps.smoke_tests.outcome == 'success' &&
          steps.core_tests.outcome != 'success'
        shell: pwsh
        run: throw 'Core parser/table tests failed. Inspect core-tests.log in the workflow artifact.'

      - name: Fail workflow when Native AOT runtime smoke failed
        if: >-
          steps.core_build.outcome == 'success' &&
          steps.smoke_tests.outcome == 'success' &&
          steps.core_tests.outcome == 'success' &&
          steps.native_aot_smoke.outcome != 'success'
        shell: pwsh
        run: throw 'Native AOT table runtime smoke failed. Inspect native-aot-runtime-smoke.log.'

      - name: Fail workflow when publish failed
        if: >-
          steps.core_build.outcome == 'success' &&
          steps.smoke_tests.outcome == 'success' &&
          steps.core_tests.outcome == 'success' &&
          steps.native_aot_smoke.outcome == 'success' &&
          steps.publish.outcome != 'success'
        shell: pwsh
        run: throw 'Native AOT publish failed. Inspect publish.log in the workflow artifact.'
