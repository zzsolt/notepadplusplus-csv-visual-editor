name: Apply reviewed pixel raster fix
on:
  pull_request:
    branches: [main]
    paths: ['.repair0126/raster.patch.xz.base64']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/source-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify and apply
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/agent/source-navigation | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          base = '50de1cc6d8c8f59a3a28054fd7e987a7879d2fee'
          allowed = {'.github/workflows/apply-raster0126.yml', '.repair0126/raster.patch.xz.base64'}
          actual = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          if actual != allowed: raise SystemExit('Unexpected changes; refusing to overwrite.')
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.repair0126/raster.patch.xz.base64').read_text(),validate=True))
          if hashlib.sha256(patch).hexdigest() != 'd337213d299cec42e4916eee6fec8f8089d57b8801235c356d84f54bb99cf276': raise SystemExit('Checksum mismatch')
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm -r .repair0126
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use deterministic legible pixel discs and require actual dock resize evidence'
          git push origin HEAD:refs/heads/agent/source-navigation
