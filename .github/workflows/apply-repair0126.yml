name: Apply reviewed GUI regression repair
on:
  pull_request:
    branches: [main]
    paths: ['.repair0126/part-*']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/source-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check base and patch before source mutation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/agent/source-navigation | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          base = 'fc36941dce70d2d3664ad46079abadf9ccebdf40'
          allowed = {'.github/workflows/apply-repair0126.yml'} | {f'.repair0126/part-{i:02d}' for i in range(4)}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Unexpected source changes; refusing to overwrite.')
          encoded = ''.join(pathlib.Path(f'.repair0126/part-{i:02d}').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '5372d2a852c5f5436ced30ac30dc1f43882fa554e653e7e3c9d6203e60fe438e':
              raise SystemExit('Reviewed patch checksum mismatch.')
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm -r .repair0126
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair table typography, visible space markers, grid borders and compact search; add native host review'
          git push origin HEAD:refs/heads/agent/source-navigation
