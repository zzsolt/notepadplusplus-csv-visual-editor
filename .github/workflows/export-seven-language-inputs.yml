name: Finalize seven-language localization
on:
  push:
    branches: [agent/localization-seven-export]
    paths: ['.github/workflows/export-seven-language-inputs.yml']
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout translation inputs
        uses: actions/checkout@v4
        with:
          path: input
          persist-credentials: false
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/localization
          path: target
          persist-credentials: true
      - name: Recover reviewed Arabic draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10340600543/zip" -o rescue.zip
          unzip -q rescue.zip -d rescue
          test -f rescue/providers/provider-ar/ar.json
      - name: Build and validate exactly seven catalogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re

          root=pathlib.Path.cwd()
          target=root/'target'
          inputs=root/'input'
          rescue=root/'rescue'
          catalog_dir=target/'src/CsvVisualEditor.Localization/Catalogs'
          en=json.loads((catalog_dir/'en.json').read_text(encoding='utf-8'))
          source=en['messages']; keys=list(source)

          def fingerprint(messages):
              payload=[[k,v['sourceHash']] for k,v in messages.items()]
              return hashlib.sha256(json.dumps(payload,ensure_ascii=True,separators=(',',':')).encode()).hexdigest()
          fp=fingerprint(source)
          if fp!='b8da12c841cc40f32c498cbf7bb47a6c16bed241b42b4a4f4a0e78d32f2eb499':
              raise ValueError('Unexpected English source fingerprint: '+fp)

          def decode(value):
              def repl(m): return {'n':'\n','r':'\r','t':'\t','\\':'\\'}[m[1]]
              if re.search(r'\\(?![nrt\\])',value): raise ValueError('Unsupported TSV escape')
              return re.sub(r'\\([nrt\\])',repl,value)

          def indexed(paths,code,require_header=False):
              rows={}; saw_fp=False
              for path in paths:
                  for line_no,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                      if not line: continue
                      if line.startswith('#'):
                          if line.startswith('# source-fingerprint:'):
                              saw_fp=True
                              if line.split(':',1)[1].strip()!=fp: raise ValueError(f'{path}: stale fingerprint')
                          if line.startswith('# language:') and line.split(':',1)[1].strip()!=code:
                              raise ValueError(f'{path}: wrong language')
                          continue
                      parts=line.split('\t',1)
                      if len(parts)!=2 or not parts[0].isdigit(): raise ValueError(f'{path}:{line_no}: malformed row')
                      index=int(parts[0])
                      if index in rows or not 0<=index<len(keys): raise ValueError(f'{code}: duplicate/out-of-range index')
                      rows[index]=decode(parts[1])
              if require_header and not saw_fp: raise ValueError(f'{code}: source fingerprint missing')
              if set(rows)!=set(range(len(keys))): raise ValueError(f'{code}: incomplete translation {len(rows)}/{len(keys)}')
              return {'language':code,'messages':{key:{'text':rows[i],'sourceHash':source[key]['sourceHash']} for i,key in enumerate(keys)}}

          manifest=json.loads((inputs/'tools/localization/curated/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('sourceFingerprint')!=fp or manifest.get('keyCount')!=len(keys): raise ValueError('Hungarian manifest mismatch')
          hu_paths=sorted((inputs/'tools/localization/curated').glob('hu-*.tsv'))
          for path in hu_paths:
              if hashlib.sha256(path.read_bytes()).hexdigest()!=manifest['files'].get(path.name): raise ValueError('Hungarian source changed: '+path.name)

          def placeholders(text):
              out=[]; i=0
              while i<len(text):
                  if text[i:i+2] in ('{{','}}'): i+=2; continue
                  if text[i]=='{':
                      match=re.match(r'\{[0-9]+(?:,-?[0-9]+)?(?::[^{}]+)?\}',text[i:])
                      if not match: raise ValueError('Malformed format placeholder')
                      out.append(match[0]); i+=len(match[0]); continue
                  if text[i]=='}': raise ValueError('Unbalanced closing brace')
                  i+=1
              return sorted(out)

          def validate(cat):
              code=cat['language']; messages=cat['messages']
              if set(messages)!=set(source): raise ValueError(code+': key coverage differs')
              for key,original in source.items():
                  entry=messages[key]; text=entry.get('text')
                  if not isinstance(text,str) or not text.strip(): raise ValueError(code+'/'+key+': empty text')
                  if entry.get('sourceHash')!=original['sourceHash']: raise ValueError(code+'/'+key+': stale source hash')
                  if placeholders(text)!=placeholders(original['text']): raise ValueError(code+'/'+key+': changed placeholders')
                  if len(original['text'])>80 and text==original['text']: raise ValueError(code+'/'+key+': untranslated prose')
                  if '-12.5' in original['text'] and '-12.5' not in text: raise ValueError(code+'/'+key+': numeric syntax changed')
                  if re.search(r'<0x[0-9A-Fa-f]+>',text): raise ValueError(code+'/'+key+': byte token')
                  if any(0xD800<=ord(c)<=0xDFFF or ord(c)<32 and c not in '\n\r\t' for c in text): raise ValueError(code+'/'+key+': invalid Unicode/control')
                  if len(text)>max(250,5*len(original['text'])): raise ValueError(code+'/'+key+': excessive length')

          catalogs={'en':en}
          for code in ('fr','es','hi','zh-CN'):
              catalogs[code]=indexed([inputs/'tools/localization/authored'/f'{code}.tsv'],code,True)
          catalogs['hu']=indexed(hu_paths,'hu')
          arabic=json.loads((rescue/'providers/provider-ar/ar.json').read_text(encoding='utf-8'))
          if arabic.get('language')!='ar': raise ValueError('Wrong Arabic catalog identity')
          key='Table.AutomaticDelimiterDetectionIsNotReliableManualSelection'
          arabic['messages'][key]={'text':'{0} — الكشف التلقائي عن الفاصل غير موثوق؛ يجب اختياره يدويًا.','sourceHash':'6f7660946313d283e3d47cd1822d536511579df717cbceb153899d32e6009243'}
          catalogs['ar']=arabic

          expected=['en','zh-CN','hi','es','ar','fr','hu']
          policy=json.loads((target/'src/CsvVisualEditor.Localization/translations.json').read_text(encoding='utf-8'))
          if policy!={'fallback':'en','translatedCodes':expected}: raise ValueError('Product translation policy differs from final candidate')
          for code in expected:
              if code!='en': validate(catalogs[code])
          for path in catalog_dir.glob('*.json'):
              if path.stem not in expected: path.unlink()
          for code in expected:
              (catalog_dir/f'{code}.json').write_text(json.dumps(catalogs[code],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Validated',len(expected),'catalogs x',len(keys),'keys')
          PY
          cd target
          python3 -m unittest discover -s tests/localization -p 'test_*.py'
          python3 tools/localization/generate.py --check
          python3 tools/localization/verify.py --check-upstream
      - name: Push final candidate commit
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "Zolnai Zsolt"
          git config user.email "44463109+zzsolt@users.noreply.github.com"
          git add src/CsvVisualEditor.Localization/Catalogs
          git diff --cached --exit-code && { echo 'No catalog changes to commit'; exit 1; } || true
          git commit -m "Ship seven maintained interface languages [test-package]"
          git push origin HEAD:agent/localization
