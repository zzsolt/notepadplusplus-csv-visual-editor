name: Patch 0.11 Clipboard Integration

on:
  push:
    branches:
      - agent/multi-cell-clipboard
    paths:
      - .clipboard-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/multi-cell-clipboard
          fetch-depth: 0

      - name: Apply audited clipboard fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/CsvVisualEditor/CsvGridClipboardController.cs')
          text = path.read_text(encoding='utf-8')

          copy_start = '''    private static bool TryCopy(DataGridView grid, CsvGridForm form)
    {
        var rectangle = CaptureRectangle(grid, useCurrentCellWhenEmpty: true);
'''
          copy_replacement = '''    private static bool TryCopy(DataGridView grid, CsvGridForm form)
    {
        if (CsvGridRowHeaderBehavior.CaptureManagedSelection(grid).SelectedIds.Count > 0)
        {
            ShowStatus(form, "Copy requires a CSV-cell rectangle, not complete-row deletion selection.");
            return true;
        }

        var rectangle = CaptureRectangle(grid, useCurrentCellWhenEmpty: true);
'''
          if copy_start not in text:
              raise SystemExit('TryCopy insertion point not found')
          text = text.replace(copy_start, copy_replacement, 1)

          set_text = '''            Clipboard.SetText(builder.ToString(), TextDataFormat.UnicodeText);
'''
          set_data = '''            var dataObject = new DataObject();
            dataObject.SetData(
                DataFormats.UnicodeText,
                autoConvert: false,
                builder.ToString());
            Clipboard.SetDataObject(dataObject, copy: true);
'''
          if set_text not in text:
              raise SystemExit('Clipboard.SetText call not found')
          text = text.replace(set_text, set_data, 1)

          read_old = '''            if (!Clipboard.ContainsText())
            {
                ShowStatus(form, "The clipboard does not contain plain text cells.");
                return true;
            }

            clipboardText = Clipboard.GetText(TextDataFormat.UnicodeText);
            if (clipboardText.Length == 0)
            {
                clipboardText = Clipboard.GetText(TextDataFormat.Text);
            }
'''
          read_new = '''            var dataObject = Clipboard.GetDataObject();
            if (dataObject is null ||
                (!dataObject.GetDataPresent(DataFormats.UnicodeText, autoConvert: false) &&
                 !dataObject.GetDataPresent(DataFormats.Text, autoConvert: false)))
            {
                ShowStatus(form, "The clipboard does not contain plain text cells.");
                return true;
            }

            clipboardText = Convert.ToString(
                    dataObject.GetData(DataFormats.UnicodeText, autoConvert: false),
                    CultureInfo.InvariantCulture)
                ?? Convert.ToString(
                    dataObject.GetData(DataFormats.Text, autoConvert: false),
                    CultureInfo.InvariantCulture)
                ?? string.Empty;
'''
          if read_old not in text:
              raise SystemExit('Clipboard read block not found')
          text = text.replace(read_old, read_new, 1)

          refresh_call = '''        form.RefreshClipboardEditState();
'''
          if refresh_call not in text:
              raise SystemExit('RefreshClipboardEditState call not found')
          text = text.replace(refresh_call, '', 1)

          path.write_text(text, encoding='utf-8')

          extension = Path('src/CsvVisualEditor/CsvGridFormClipboardExtensions.cs')
          if extension.exists():
              extension.unlink()

      - name: Remove transient patch files
        shell: bash
        run: |
          rm -f .github/workflows/patch-0.11-clipboard.yml
          rm -f .clipboard-patch-trigger

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix: harden clipboard focus and empty-cell handling"
          git push origin HEAD:agent/multi-cell-clipboard
