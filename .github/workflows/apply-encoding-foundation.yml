name: Apply encoding-safe foundation

on:
  push:
    branches:
      - agent/encoding-safe-apply
    paths:
      - .encoding-foundation/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout milestone branch
        uses: actions/checkout@v4
        with:
          ref: agent/encoding-safe-apply
          fetch-depth: 0

      - name: Decode and validate patch
        shell: bash
        run: |
          base64 --decode .encoding-foundation/patch.b64 | gzip --decompress > /tmp/encoding-foundation.patch
          echo "62ab739bc9304877ef5ac24076d3fbcb0ba09cfa91039cbacc66ede503d01bea  /tmp/encoding-foundation.patch.gz" > /tmp/expected.sha256
          gzip -c /tmp/encoding-foundation.patch > /tmp/encoding-foundation.patch.gz
          sha256sum --check /tmp/expected.sha256
          git apply --check /tmp/encoding-foundation.patch

      - name: Apply audited foundation
        shell: bash
        run: |
          git apply /tmp/encoding-foundation.patch
          rm -rf .encoding-foundation
          rm -f .github/workflows/apply-encoding-foundation.yml
          git add --all
          git diff --cached --check

      - name: Commit encoding-safe foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add strict encoding Apply preflight"
          git push origin HEAD:agent/encoding-safe-apply
