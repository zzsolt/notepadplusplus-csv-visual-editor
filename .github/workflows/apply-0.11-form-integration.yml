name: Apply 0.11 Grid Clipboard Integration

on:
  push:
    branches:
      - agent/multi-cell-clipboard
    paths:
      - .github/workflows/apply-0.11-form-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/multi-cell-clipboard
          fetch-depth: 0

      - name: Patch CsvGridForm
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/CsvVisualEditor/CsvGridForm.cs')
          text = path.read_text(encoding='utf-8')
          needle = '''    public bool CommitPendingEdit()
    {
        return !_grid.IsCurrentCellInEditMode || _grid.EndEdit();
    }
'''
          replacement = needle + '''
    internal void RefreshClipboardEditState()
    {
        UpdateDirtyIndicators();
    }
'''
          if 'internal void RefreshClipboardEditState()' not in text:
              if needle not in text:
                  raise SystemExit('CommitPendingEdit insertion point not found')
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')

      - name: Remove transient workflow and trigger
        shell: bash
        run: |
          rm -f .github/workflows/apply-0.11-form-integration.yml
          rm -f .source-snapshot-0.11
          rm -f .github/workflows/source-snapshot-0.11.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat: integrate multi-cell clipboard with grid state"
          git push origin HEAD:agent/multi-cell-clipboard
