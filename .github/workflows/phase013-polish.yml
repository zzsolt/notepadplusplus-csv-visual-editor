name: Apply inspected data-tool layout polish
on:
  push:
    branches: [agent/data-exploration]
    paths: [.github/workflows/phase013-polish.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'c8ab9eea03e5acff2ce0356a786a367eb426dbea'
          test "$(git ls-remote origin refs/heads/agent/data-exploration | cut -f1)" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '22ce5e2805d8d89a9148d0be740e8db3158dc336317f85ef9ca58eda534298ca'
          pathlib.Path('/tmp/polish.patch').write_bytes(patch)
          PY
          git apply --check /tmp/polish.patch
          git apply --index /tmp/polish.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          if git diff --cached --name-only | grep -Ev '^(src/|tests/|docs/)'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep AutoSize filter rows aligned, remove clipped case caption, test menu parity and document data-view semantics'
          git push origin HEAD:refs/heads/agent/data-exploration
