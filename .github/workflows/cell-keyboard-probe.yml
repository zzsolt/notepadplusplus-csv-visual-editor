name: Cell keyboard reproduction
on:
  push:
    branches: [agent/cell-keyboard-probe]
    paths: ['.github/workflows/cell-keyboard-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CsvVisualEditor-0.15.0-alpha.416.1-win-x64
          run-id: 34963625802
          github-token: ${{ github.token }}
          path: prior
      - shell: pwsh
        run: |
          Expand-Archive prior/CsvVisualEditor-0.15.0-alpha.416.1-win-x64.zip prior/package
          $script = (Get-Content .github/keyboard-probe.ps1 -Raw).Replace('Changes remain pending', 'Changes stay pending')
          Set-Content .github/keyboard-probe.ps1 $script
          .github/keyboard-probe.ps1 -LibraryPath prior/package/CsvVisualEditor/CsvVisualEditor.dll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-keyboard-reproduction
          path: keyboard-evidence
          retention-days: 7
