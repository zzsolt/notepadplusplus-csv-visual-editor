name: Cell keyboard reproduction
on:
  push:
    branches: [agent/cell-keyboard-probe]
    paths: ['.github/workflows/cell-keyboard-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 283fdfbacf8e7d025dc13169caf8c5b150d42665
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish only the current production plugin
        shell: pwsh
        run: dotnet publish src/CsvVisualEditor/CsvVisualEditor.csproj -c Release -f net10.0-windows -r win-x64 -p:Version=0.15.0-keyboard-probe -o keyboard-publish
      - name: Reproduce Space and literal-backslash typing in real Notepad++
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force keyboard-evidence | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE 'keyboard-evidence'
          pwsh -NoProfile -File tests/host-review/Invoke-KeyboardInputReview.ps1 -LibraryPath keyboard-publish/CsvVisualEditor.dll -OutputPath $out *>&1 | Tee-Object -FilePath (Join-Path $out 'keyboard.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-keyboard-reproduction
          path: keyboard-evidence
          if-no-files-found: warn
          retention-days: 2
